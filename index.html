<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pedro Nero • 1 aninho</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #dff4ff;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 941 / 1672));
      aspect-ratio: 941 / 1672;
      overflow: hidden;
      background: #dff4ff;
    }
    .art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .hotspot {
      position: absolute;
      display: block;
      z-index: 2;
      border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .debug .hotspot {
      outline: 3px solid red;
      background: rgba(255,0,0,.18);
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Espaço interativo do Pedro Nero">
    <img class="art" src="assets/tela-inicial.png" alt="Pedro Nero 1 aninho">
    <a id="fotoBtn" class="hotspot" href="foto.html" aria-label="Filtro para foto"></a>
    <a id="quizBtn" class="hotspot" href="quiz.html" aria-label="Quiz do aniversariante"></a>
  </main>

  <script src="config.js"></script>
  <script>
    const cfg = window.EVENTO_CONFIG || {};
    const botoes = cfg.botoes || {};

    function aplicarArea(id, area) {
      if (!area) return;
      const el = document.getElementById(id);
      el.style.left = area.x + "%";
      el.style.top = area.y + "%";
      el.style.width = area.largura + "%";
      el.style.height = area.altura + "%";
    }

    aplicarArea("fotoBtn", botoes.foto);
    aplicarArea("quizBtn", botoes.quiz);

    if (new URLSearchParams(location.search).get("debug") === "1") {
      document.getElementById("stage").classList.add("debug");
    }
  </script>
</body>
</html>
