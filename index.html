<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pedro Nero • 1 aninho</title>
  <style>
    * { box-sizing: border-box; }
    html,body { margin:0; min-height:100%; background:#dff4ff; }
    body { display:flex; justify-content:center; font-family:Arial,sans-serif; }
    .stage {
      position:relative;
      width:min(100vw, calc(100vh * 9 / 16));
      aspect-ratio:9/16;
      overflow:hidden;
      background:linear-gradient(#dff4ff,#fff);
    }
    .art {
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      user-select:none; -webkit-user-drag:none;
    }
    .menu {
      position:absolute; left:50%; top:38%; transform:translateX(-50%);
      width:58%; display:flex; flex-direction:column; gap:18px; z-index:3;
    }
    .menu a {
      display:flex; align-items:center; justify-content:center; text-align:center;
      min-height:68px; padding:14px 18px; border-radius:999px;
      text-decoration:none; font-weight:800; font-size:clamp(18px,4.4vw,26px);
      color:#fff; background:linear-gradient(180deg,#2f9fe7,#0874ba);
      border:4px solid rgba(255,255,255,.92);
      box-shadow:0 8px 20px rgba(0,75,125,.28), inset 0 2px 0 rgba(255,255,255,.45);
      text-shadow:0 2px 4px rgba(0,0,0,.2);
    }
    .menu a:active { transform:scale(.98); }
    .hint {
      position:absolute; left:50%; top:32%; transform:translateX(-50%);
      width:72%; text-align:center; color:#1975a8; font-weight:800;
      font-size:clamp(16px,3.8vw,22px); text-shadow:0 1px 2px #fff;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Espaço interativo do Pedro Nero">
    <img class="art" src="assets/moldura.png" alt="Moldura Pedro Nero 1 aninho">
    <div class="hint">Escolha uma opção</div>
    <nav class="menu">
      <a href="quiz.html">Quiz do Pedro Nero</a>
      <a href="foto.html">Filtro para foto</a>
    </nav>
  </main>
</body>
</html>
